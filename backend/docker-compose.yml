# PostgreSQL local para desarrollo. Uso: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oficioya
      POSTGRES_PASSWORD: oficioya
      POSTGRES_DB: oficioya
    ports:
      - "5432:5432"
    volumes:
      - oficioya-db:/var/lib/postgresql/data
volumes:
  oficioya-db:
