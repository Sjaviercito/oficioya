# Mantiene despierta la API de Render (plan gratuito) en horario de uso y dispara las tareas
# periódicas: cierre automático de trabajos a las 72 h y recálculo diario del ranking (RF-10, RF-26).
# Horario: de 8:00 a 19:59 de Puebla (UTC-6) = 14:00–01:59 UTC, cada 14 min (Render se duerme a los 15).
# En un repositorio privado GitHub Free incluye 2,000 minutos al mes y cobra cada ejecución como 1 minuto:
# 5 pings/h × 12 h × 31 días ≈ 1,860 minutos. Si el repositorio se hace público, los minutos son
# gratuitos y se puede ampliar el horario. GitHub puede retrasar las ejecuciones programadas.
name: Mantener despierta la API

on:
  schedule:
    - cron: '*/14 14-23,0-1 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping a /api/v1/health
        run: curl --fail --silent --show-error --max-time 90 https://oficioya-api.onrender.com/api/v1/health
